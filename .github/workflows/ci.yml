name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试（合并 / 会话裁决 / 令牌）
        run: |
          npm run test:merge
          npm run test:boot
          npm run test:token

      - name: 构建（不需要任何密钥）
        run: npm run build
